name: Build production candidate

on:
  push:
    branches:
      - 'dev/**'
      - 'feature/**'
      - main
    paths:
      - 'src/**'
      - 'lang/**'
      - 'tests/**'
      - 'CompactCraftingTooltips.csproj'
      - 'nuget.config'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-crafting-tooltips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Verify source identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          $expected = '${{ github.sha }}'
          if ($actual -ne $expected) {
            throw "Source identity mismatch: expected $expected, got $actual"
          }
          "source_sha=$actual"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run formatter contract
        run: dotnet run --project tests/FormatterContract/FormatterContract.csproj -c Release

      - name: Restore production
        run: dotnet restore CompactCraftingTooltips.csproj --configfile nuget.config

      - name: Build production
        run: dotnet build CompactCraftingTooltips.csproj -c Release --no-restore

      - name: Prepare artifact
        shell: pwsh
        run: |
          $dll = Resolve-Path 'bin/Release/CompactCraftingTooltips.dll'
          $out = Join-Path $PWD 'artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll (Join-Path $out 'CompactCraftingTooltips.dll')
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'version=0.1.1'
            'candidate=0.1.1'
            'source_sha=${{ github.sha }}'
            "sha256=$hash"
            'assembly=CompactCraftingTooltips.dll'
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'BUILD_IDENTITY.txt')
          Get-Content (Join-Path $out 'BUILD_IDENTITY.txt')

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: CompactCraftingTooltips-0.1.1-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
